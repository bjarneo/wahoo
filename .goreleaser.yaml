version: 2

project_name: wahoo

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/wahoo
    binary: wahoo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: bjarneo
    name: wahoo
