name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "v2.17.1"
          args: release --clean
      - name: Import release signing key
        env:
          WAHOO_RELEASE_GPG_KEY: ${{ secrets.WAHOO_RELEASE_GPG_KEY }}
        run: printf '%s' "$WAHOO_RELEASE_GPG_KEY" | gpg --batch --import
      - name: Sign release checksums
        env:
          WAHOO_RELEASE_GPG_PASSPHRASE: ${{ secrets.WAHOO_RELEASE_GPG_PASSPHRASE }}
        run: gpg --batch --pinentry-mode loopback --passphrase "$WAHOO_RELEASE_GPG_PASSPHRASE" --armor --detach-sign --output dist/checksums.txt.asc dist/checksums.txt
      - name: Upload checksum signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.asc --clobber
